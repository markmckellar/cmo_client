# Porch camera (the Jarnex camera at 192.168.1.247, watched from mckada): run with
#   .venv/bin/python cmo_watch.py porch_cam.properties
# Every key has a default in cmo_watch.py (DEFAULTS); remove or comment out a line to use the default. An
# unknown key stops cmo_watch with an error, so a typo doesn't go unnoticed.
# Lists are comma separated. Paths are relative to this file.

# Camera name on cmo_server, also the folder its buffer and events are kept in (local/porch_cam/)
me_group = porch_cam

# ---- camera -----------------------------------------------------------------
# The Jarnex network camera's RTSP sub stream: 640x360 H.264 with audio. Its main stream (V_ENC_000,
# 2560x1440 HEVC) stalls on this camera, so the sub stream is what gets recorded.
camera.type = rtsp
# The URL without the login: that comes from credentials_file (CAM_USER=... and CAM_PASS=... lines, mode
# 600), and ffmpeg gets it in a private list file, so the password is never on a command line.
camera.url = rtsp://192.168.1.247/V_ENC_001
camera.credentials_file = ~/.config/porch_watch.env
# The stream's size (the motion check's frames are scaled from it)
camera.width = 640
camera.height = 360
# Record the camera's audio too (converted to AAC)
camera.audio = true
# Extra ffmpeg options before -i, as on a command line
camera.input_options =
# A movie file to play instead of the camera (testing); empty = the camera
camera.source =

# ---- ring buffer of the last few minutes of video -----------------------------
# Empty = local/porch_cam/buffer
buffer.dir =
buffer.segment_seconds = 4
buffer.keep_minutes = 5
# Restart ffmpeg when no video has arrived for this many seconds
buffer.stall_seconds = 20

# ---- motion check -------------------------------------------------------------
# Frames a second checked for motion, and their width
motion.fps = 4
motion.analysis_width = 640
# Gray-level change (0-255) that counts a 4x4 block of pixels as changed
motion.pixel_threshold = 14
# Fraction of the picture that must change for a frame to count as moving (0.01 = 1%)
motion.motion_threshold = 0.004
# Moving frames (within twice that many) that open an event
motion.min_motion_frames = 2
# Events with fewer moving frames are dropped without asking Ollama
motion.min_event_frames = 3
# Areas to ignore, as x0,y0,x1,y1 boxes (0-1 of the picture) separated by ;
# The camera burns a ticking clock into the top left, which would otherwise be motion every second
motion.masks = 0,0,0.32,0.14

# ---- events (seconds) ---------------------------------------------------------
# Movie starts this long before the motion
event.pre_roll = 3.0
# An event ends after this long without motion, and the movie runs on this long after it
event.post_roll = 4.0
# Longer events are cut into pieces of at most this long
event.max_event = 120.0

# ---- classification ---------------------------------------------------------
# Each event's movie is classified by the shared cmo_ollama scripts (call_ollama_movie.bash), the same
# ones every camera uses and that are tested on cmo_ollama's labeled clips. The Ollama server is the
# api= setting in that folder's ollama_common.bash, the same file every machine uses.
classifier.cmo_ollama_dir = ~/dev/cmo_ollama
classifier.model = qwen3-vl:8b
# A question name from ollama_common.bash
classifier.question = person_animal_question
# Best moving frames kept during an event, at least min_gap seconds apart, to choose me_rep_image.jpg from
classifier.max_frames = 4
classifier.min_gap = 1.5
# Ask cmo_ollama which of them shows the match best (usually one call)
classifier.rep_frame_llm = true
# If cmo_ollama can't answer (Ollama down), keep and upload the event anyway (all labels false, "error": true).
# Off for the porch: it has hundreds of motion events a day.
classifier.upload_unclassified = false

# ---- uploading ----------------------------------------------------------------
# Where finished events wait to be uploaded; empty = local/porch_cam/events
events_dir =
# cmo_servers to send every event to, comma separated. Empty = the cmo_server set in cmo_ollama's
# ollama_common.bash, which every camera uses, so in any setup they all upload to the same
# server (for a test server, set cmo_server in that machine's ollama_env_props.bash).
upload.servers =
# Seconds between tries of a failed upload
upload.retry_seconds = 60
# Delete an event once every server has it; otherwise keep it keep_days days
upload.delete_after_upload = false
upload.keep_days = 30

# ---- Telegram -----------------------------------------------------------------
# Send each event to Telegram once it is uploaded: the picture, links to the web client and the movie,
# and what was seen (the format cmo_alerts used). Needs telegram-send, configured with
# telegram-send --configure (~/.config/telegram-send.conf); the bot token stays in that file.
# On mckada that is the porch camera's own bot (the pet door has a different one, @DeCatsBot).
telegram.enabled = true
# Empty = telegram-send on the PATH, else ~/.local/bin/telegram-send
telegram.program =
# Empty = ~/.config/telegram-send.conf
telegram.config =
# Extra "RACCOON ALERT!!!" messages when a raccoon is seen
telegram.raccoon_alert_count = 0

# ---- Google Home announcements -------------------------------------------------
# Say a message on the Google Home speakers when an event shows a cat, a raccoon, ... (google_home.py).
# It is said right after the event is classified, on every speaker at once.
google_home.enabled = false
# The speakers, as name=address, comma separated (names are for the log and google_home.py --device)
# (the study speaker, study=192.168.1.108, is left out while it is offline)
google_home.devices = bedroom=192.168.1.122, upstairs=192.168.1.149, workout=192.168.1.241
# Language of Google's text-to-speech voice
google_home.language = en
# What to say for each label; empty = say nothing for it. An event with several of these labels gets
# their messages one after another, in this order. At most 200 characters in all.
google_home.message.raccoon = Raccoon alert! There is a raccoon at the door
google_home.message.cat = There is a cat at the door
google_home.message.dog =
google_home.message.person =
google_home.message.legs =
google_home.message.animal =

# ---- health alerts --------------------------------------------------------------
# Check every check_seconds that Ollama, the camera, the cmo_server(s) and the disks are working (health.py).
# A problem that lasts down_minutes gets one Telegram message (with the bot above), and one more when it
# is fixed; nothing for shorter dropouts. Without Telegram the messages are only logged.
health.enabled = true
health.check_seconds = 60
health.down_minutes = 5
# A reminder while it stays down; 0 = never
health.repeat_hours = 24
# Less free disk than this, here (where the events are kept) or on a cmo_server, is a problem
health.min_free_gb = 2

# ---- daily report ---------------------------------------------------------------
# Once a day a Telegram message (with the bot above): what was seen in the last 24 hours (each label, the
# uncategorized events), the motion events and Ollama's times, the health now and the problems during the
# day, uploads waiting and free disk (daily.py). Without Telegram it is only logged.
report.enabled = true
# Local time, HH:MM. A report missed while cmo_watch was stopped is sent when it starts (up to 12 h late).
report.time = 09:00
# Days of history kept for it, in local/<me_group>/history.jsonl ("last seen" looks back this far)
report.history_days = 31

# ---- other --------------------------------------------------------------------
# Keep a grid image + json of events with no target in local/porch_cam/rejects/, for tuning the motion settings
save_rejects = false
# Empty = ~/logs/porch_cam.log. Kept as porch_watch.log, its name before cmo_watch, next to the pet door
# camera's pet_watch.log and cmo_ollama's call_ollama.log. Rolled over at 5 MB.
log_file = ~/logs/porch_watch.log
